<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estrenos - Nuestro Cine</title>
  <meta name="description" content="Espacio para nuevos momentos compartidos">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    /* Fondo general oscuro */
    body {
      background-color: #0a0a0a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Contenedor principal con efecto cuaderno realista */
    .contenedor-mensaje {
      background: 
        /* Textura de papel */
        linear-gradient(rgba(245, 245, 220, 0.2), rgba(245, 245, 220, 0.2)),
        /* Color base del papel */
        #f5f5dc;
      
      width: 90%;
      max-width: 800px;
      min-height: 300px;
      margin: 40px auto;
      padding: 40px;
      border-radius: 3px;
      box-shadow: 
        0 0 10px rgba(198, 40, 40, 0.6),
        0 0 30px rgba(0, 0, 0, 0.3);
      position: relative;
      border: 12px solid #f39c12;
      border-image: linear-gradient(to right, #f39c12, #c62828, #f39c12) 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Efecto de esquina doblada */
    .contenedor-mensaje::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, transparent 50%, #d4a76a 50%, #c62828 100%);
      box-shadow: -2px 2px 5px rgba(0, 0, 0, 0.2);
    }

    /* Estilo del mensaje */
    .mensaje-estreno {
      font-size: 1.8em;
      color: #c62828;
      line-height: 1.5;
      padding: 30px;
      border: 2px dashed #c62828;
      border-radius: 5px;
      background-color: rgba(255, 255, 255, 0.8);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Botón volver mejorado */
    .volver a {
      display: inline-block;
      padding: 10px 25px;
      background-color: #c62828;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      transition: all 0.3s;
      font-weight: bold;
      margin: 30px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
      border: 2px solid #c62828;
      font-size: 1em;
    }

    .volver a:hover {
      background-color: #f39c12;
      border: 2px solid #f39c12;
      transform: translateX(-5px);
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.4);
    }

    /* Encabezado */
    .encabezado {
      text-align: center;
      padding: 25px 20px 15px;
      background: linear-gradient(to bottom, #0a0a0a, #222);
      position: relative;
      z-index: 10;
    }

    .encabezado .logo {
      max-height: 70px;
      filter: drop-shadow(0 0 5px rgba(243, 156, 18, 0.7));
    }

    .encabezado h1 {
      color: #f39c12;
      margin: 10px 0 0;
      font-size: 1.8em;
      text-shadow: 0 0 8px rgba(243, 156, 18, 0.5);
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .contenedor-mensaje {
        width: 95%;
        padding: 30px 20px;
      }
      
      .mensaje-estreno {
        font-size: 1.5em;
        padding: 20px;
      }
      
      .volver a {
        margin: 20px 10px;
        padding: 8px 20px;
      }
    }

    @media (max-width: 480px) {
      .contenedor-mensaje {
        width: 98%;
        padding: 25px 15px;
      }
      
      .mensaje-estreno {
        font-size: 1.3em;
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header class="encabezado" role="banner">
    <img src="img/logo.png" alt="Logo" class="logo">
    <h1>Próximos Estrenos</h1>
  </header>

  <!-- Navegación -->
  <nav class="volver" aria-label="Navegación secundaria">
    <a href="cartelera.html" aria-label="Volver a la cartelera de películas">⬅ Volver a la cartelera</a>
  </nav>

  <!-- Contenedor del mensaje -->
  <main class="contenedor-mensaje">
    <div class="mensaje-estreno">
      Espacio destinado para nuevos momentos compartidos que plasmaré en nuestro cine.
    </div>
  </main>

</body>
</html>

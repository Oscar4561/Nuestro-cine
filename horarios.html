<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horarios - Fechas que no se pueden olvidar</title>
  <meta name="description" content="Calendario de fechas importantes">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    /* Fondo general oscuro */
    body {
      background-color: #0a0a0a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Contenedor principal con efecto cuaderno realista */
    .contenedor-calendario {
      background: 
        /* Textura de papel */
        linear-gradient(rgba(245, 245, 220, 0.2), rgba(245, 245, 220, 0.2)),
        /* Color base del papel */
        #f5f5dc;
      
      width: 90%;
      max-width: 900px;
      min-height: 70vh;
      margin: 40px auto;
      padding: 30px;
      border-radius: 3px;
      box-shadow: 
        0 0 10px rgba(198, 40, 40, 0.6),
        0 0 30px rgba(0, 0, 0, 0.3);
      position: relative;
      border: 12px solid #f39c12;
      border-image: linear-gradient(to right, #f39c12, #c62828, #f39c12) 1;
    }

    /* Efecto de esquina doblada */
    .contenedor-calendario::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, transparent 50%, #d4a76a 50%, #c62828 100%);
      box-shadow: -2px 2px 5px rgba(0, 0, 0, 0.2);
    }

    /* Estilo del título */
    .titulo-principal {
      text-align: center;
      color: #c62828;
      font-size: 2.3em;
      margin: 0 0 20px 0;
      padding-bottom: 10px;
      border-bottom: 2px dashed #c62828;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    /* Controles del calendario */
    .controles-calendario {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 5px;
    }

    .boton-mes {
      background: linear-gradient(to right, #c62828, #a02020);
      color: white;
      border: none;
      border-radius: 5px;
      padding: 8px 15px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    .boton-mes:hover {
      background: linear-gradient(to right, #f39c12, #e67e22);
      transform: scale(1.05);
    }

    .mes-anio {
      font-size: 1.4em;
      font-weight: bold;
      color: #333;
    }

    /* Grid del calendario */
    .dias-semana {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 10px;
      text-align: center;
      font-weight: bold;
      color: #c62828;
    }

    .dias-mes {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .dia {
      min-height: 80px;
      padding: 5px;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 3px;
      border-left: 3px solid #c62828;
      position: relative;
      transition: all 0.3s;
    }

    .dia:hover {
      background-color: rgba(255, 255, 255, 0.9);
      transform: translateY(-3px);
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
    }

    .numero-dia {
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }

    .dia-otro-mes {
      opacity: 0.5;
      background-color: rgba(255, 255, 255, 0.4);
    }

    .dia-hoy {
      background-color: rgba(243, 156, 18, 0.2);
      border-left: 3px solid #f39c12;
    }

    /* Eventos en los días */
    .evento {
      font-size: 0.7em;
      background-color: rgba(198, 40, 40, 0.2);
      padding: 2px 5px;
      border-radius: 3px;
      margin-top: 2px;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .evento:hover {
      background-color: rgba(198, 40, 40, 0.3);
    }

    /* Botón volver mejorado */
    .volver a {
      display: inline-block;
      padding: 10px 25px;
      background-color: #c62828;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      transition: all 0.3s;
      font-weight: bold;
      margin: 30px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
      border: 2px solid #c62828;
      font-size: 1em;
    }

    .volver a:hover {
      background-color: #f39c12;
      border: 2px solid #f39c12;
      transform: translateX(-5px);
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.4);
    }

    /* Encabezado */
    .encabezado {
      text-align: center;
      padding: 25px 20px 15px;
      background: linear-gradient(to bottom, #0a0a0a, #222);
      position: relative;
      z-index: 10;
    }

    .encabezado .logo {
      max-height: 70px;
      filter: drop-shadow(0 0 5px rgba(243, 156, 18, 0.7));
    }

    .encabezado h1 {
      color: #f39c12;
      margin: 10px 0 0;
      font-size: 1.8em;
      text-shadow: 0 0 8px rgba(243, 156, 18, 0.5);
    }

    /* Modal para agregar eventos - MEJORADO */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-contenido {
      background-color: #f5f5dc;
      padding: 30px;
      border-radius: 8px;
      width: 85%;
      max-width: 450px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      border: 5px solid #f39c12;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-titulo {
      color: #c62828;
      margin: 0;
      text-align: center;
      font-size: 1.5em;
      padding-bottom: 10px;
      border-bottom: 2px dashed #c62828;
    }

    .modal-input-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .modal-input {
      width: 100%;
      padding: 12px 15px;
      margin: 0 auto;
      border: 2px solid #c62828;
      border-radius: 5px;
      font-size: 1em;
      background-color: rgba(255, 255, 255, 0.9);
      transition: all 0.3s;
      box-sizing: border-box;
    }

    .modal-input:focus {
      outline: none;
      border-color: #f39c12;
      box-shadow: 0 0 5px rgba(243, 156, 18, 0.5);
    }

    .modal-botones {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .modal-boton {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      min-width: 100px;
    }

    .modal-boton.guardar {
      background-color: #c62828;
      color: white;
    }

    .modal-boton.guardar:hover {
      background-color: #a02020;
      transform: translateY(-2px);
    }

    .modal-boton.cancelar {
      background-color: #555;
      color: white;
    }

    .modal-boton.cancelar:hover {
      background-color: #333;
      transform: translateY(-2px);
    }

    .modal-boton.eliminar {
      background-color: #d9534f;
      color: white;
    }

    .modal-boton.eliminar:hover {
      background-color: #c9302c;
      transform: translateY(-2px);
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .contenedor-calendario {
        width: 95%;
        padding: 20px 15px;
      }
      
      .titulo-principal {
        font-size: 1.8em;
      }
      
      .volver a {
        margin: 20px 10px;
        padding: 8px 20px;
      }
      
      .dia {
        min-height: 60px;
      }
    }

    @media (max-width: 480px) {
      .contenedor-calendario {
        width: 98%;
        padding: 15px 10px;
      }
      
      .evento {
        font-size: 0.6em;
      }
      
      .numero-dia {
        font-size: 0.8em;
      }
      
      .modal-contenido {
        width: 90%;
        padding: 20px;
      }
      
      .modal-botones {
        flex-direction: column;
        gap: 10px;
      }
      
      .modal-boton {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header class="encabezado" role="banner">
    <img src="img/logo.png" alt="Logo" class="logo">
    <h1>Horarios (Fechas que no se pueden olvidar)</h1>
  </header>

  <!-- Navegación -->
  <nav class="volver" aria-label="Navegación secundaria">
    <a href="cartelera.html" aria-label="Volver a la cartelera de películas">⬅ Volver a la cartelera</a>
  </nav>

  <!-- Contenedor del calendario -->
  <main class="contenedor-calendario">
    <h2 class="titulo-principal">Calendario de Fechas Importantes</h2>
    
    <div class="controles-calendario">
      <button class="boton-mes" id="mes-anterior">◀ Mes Anterior</button>
      <h3 class="mes-anio" id="mes-actual">Mes y Año</h3>
      <button class="boton-mes" id="mes-siguiente">Mes Siguiente ▶</button>
    </div>
    
    <div class="dias-semana">
      <div>Dom</div>
      <div>Lun</div>
      <div>Mar</div>
      <div>Mié</div>
      <div>Jue</div>
      <div>Vie</div>
      <div>Sáb</div>
    </div>
    
    <div class="dias-mes" id="dias-mes">
      <!-- Los días se generarán con JavaScript -->
    </div>
  </main>

  <!-- Modal para agregar/editar eventos - MEJORADO -->
  <div class="modal" id="modal-evento">
    <div class="modal-contenido">
      <h3 class="modal-titulo" id="modal-titulo">Nuevo Evento</h3>
      
      <div class="modal-input-container">
        <input type="text" class="modal-input" id="evento-texto" placeholder="Escribe aquí el evento importante...">
      </div>
      
      <div class="modal-botones">
        <button class="modal-boton cancelar" id="cancelar-evento">Cancelar</button>
        <button class="modal-boton guardar" id="guardar-evento">Guardar</button>
        <button class="modal-boton eliminar" id="eliminar-evento" style="display: none;">Eliminar</button>
      </div>
    </div>
  </div>

  <script>
    // Variables globales
    let fechaActual = new Date();
    let diaSeleccionado = null;
    let eventos = JSON.parse(localStorage.getItem('eventos')) || {};

    // Elementos del DOM
    const mesAnioElement = document.getElementById('mes-actual');
    const diasMesElement = document.getElementById('dias-mes');
    const mesAnteriorBtn = document.getElementById('mes-anterior');
    const mesSiguienteBtn = document.getElementById('mes-siguiente');
    const modal = document.getElementById('modal-evento');
    const modalTitulo = document.getElementById('modal-titulo');
    const eventoTexto = document.getElementById('evento-texto');
    const guardarEventoBtn = document.getElementById('guardar-evento');
    const cancelarEventoBtn = document.getElementById('cancelar-evento');
    const eliminarEventoBtn = document.getElementById('eliminar-evento');

    // Inicializar calendario
    function inicializarCalendario() {
      actualizarCalendario();
      
      // Event listeners
      mesAnteriorBtn.addEventListener('click', () => {
        fechaActual.setMonth(fechaActual.getMonth() - 1);
        actualizarCalendario();
      });
      
      mesSiguienteBtn.addEventListener('click', () => {
        fechaActual.setMonth(fechaActual.getMonth() + 1);
        actualizarCalendario();
      });
      
      guardarEventoBtn.addEventListener('click', guardarEvento);
      cancelarEventoBtn.addEventListener('click', cerrarModal);
      eliminarEventoBtn.addEventListener('click', eliminarEvento);
    }

    // Actualizar el calendario
    function actualizarCalendario() {
      // Actualizar el título del mes y año
      const opciones = { month: 'long', year: 'numeric' };
      mesAnioElement.textContent = fechaActual.toLocaleDateString('es-ES', opciones).toUpperCase();
      
      // Limpiar el grid de días
      diasMesElement.innerHTML = '';
      
      // Obtener primer día del mes y último día del mes
      const primerDiaMes = new Date(fechaActual.getFullYear(), fechaActual.getMonth(), 1);
      const ultimoDiaMes = new Date(fechaActual.getFullYear(), fechaActual.getMonth() + 1, 0);
      
      // Obtener día de la semana del primer día (0-6 donde 0 es domingo)
      const diaSemanaPrimerDia = primerDiaMes.getDay();
      
      // Obtener último día del mes anterior
      const ultimoDiaMesAnterior = new Date(fechaActual.getFullYear(), fechaActual.getMonth(), 0).getDate();
      
      // Agregar días del mes anterior
      for (let i = diaSemanaPrimerDia; i > 0; i--) {
        const dia = document.createElement('div');
        dia.className = 'dia dia-otro-mes';
        dia.textContent = ultimoDiaMesAnterior - i + 1;
        diasMesElement.appendChild(dia);
      }
      
      // Agregar días del mes actual
      const hoy = new Date();
      for (let i = 1; i <= ultimoDiaMes.getDate(); i++) {
        const dia = document.createElement('div');
        dia.className = 'dia';
        
        // Marcar si es hoy
        if (i === hoy.getDate() && fechaActual.getMonth() === hoy.getMonth() && fechaActual.getFullYear() === hoy.getFullYear()) {
          dia.classList.add('dia-hoy');
        }
        
        const numeroDia = document.createElement('div');
        numeroDia.className = 'numero-dia';
        numeroDia.textContent = i;
        dia.appendChild(numeroDia);
        
        // Agregar eventos existentes
        const fechaKey = `${fechaActual.getFullYear()}-${fechaActual.getMonth() + 1}-${i}`;
        if (eventos[fechaKey]) {
          const evento = document.createElement('div');
          evento.className = 'evento';
          evento.textContent = eventos[fechaKey];
          evento.addEventListener('click', () => abrirModal(fechaKey, true));
          dia.appendChild(evento);
        } else {
          dia.addEventListener('click', () => abrirModal(fechaKey, false));
        }
        
        diasMesElement.appendChild(dia);
      }
      
      // Calcular días restantes para completar la última semana
      const diasRestantes = 42 - (diaSemanaPrimerDia + ultimoDiaMes.getDate());
      
      // Agregar días del siguiente mes
      for (let i = 1; i <= diasRestantes; i++) {
        const dia = document.createElement('div');
        dia.className = 'dia dia-otro-mes';
        dia.textContent = i;
        diasMesElement.appendChild(dia);
      }
    }

    // Abrir modal para agregar/editar evento
    function abrirModal(fechaKey, esEventoExistente) {
      diaSeleccionado = fechaKey;
      
      if (esEventoExistente) {
        modalTitulo.textContent = 'Editar Evento';
        eventoTexto.value = eventos[fechaKey];
        eliminarEventoBtn.style.display = 'block';
      } else {
        modalTitulo.textContent = 'Agregar Evento';
        eventoTexto.value = '';
        eliminarEventoBtn.style.display = 'none';
      }
      
      modal.style.display = 'flex';
      eventoTexto.focus();
    }

    // Cerrar modal
    function cerrarModal() {
      modal.style.display = 'none';
      diaSeleccionado = null;
    }

    // Guardar evento
    function guardarEvento() {
      if (eventoTexto.value.trim() === '') {
        alert('Por favor ingresa una descripción para el evento');
        return;
      }
      
      eventos[diaSeleccionado] = eventoTexto.value.trim();
      localStorage.setItem('eventos', JSON.stringify(eventos));
      actualizarCalendario();
      cerrarModal();
    }

    // Eliminar evento
    function eliminarEvento() {
      delete eventos[diaSeleccionado];
      localStorage.setItem('eventos', JSON.stringify(eventos));
      actualizarCalendario();
      cerrarModal();
    }

    // Inicializar el calendario al cargar la página
    document.addEventListener('DOMContentLoaded', inicializarCalendario);
  </script>

</body>
</html>
